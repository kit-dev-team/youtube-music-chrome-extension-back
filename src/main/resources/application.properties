spring.application.name=yt-music-extension-back

# [Database ??]
spring.datasource.url=jdbc:mysql://localhost:3306/yt_music
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [JPA ??]
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.SQL=debug

# [OAuth2 ??] - ??? ???? ?? ?? ????
# ?? ???? ???, ??? ?? ?? ??? ?????.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email,https://www.googleapis.com/auth/youtube

# [JWT ??]
# ???: ?? 32? ??? ?? ??? (??? ?? ???? ??)
jwt.secret=${JWT_SECRET}
# ?? ??: 3600000ms = 1??
jwt.expiration-time=3600000